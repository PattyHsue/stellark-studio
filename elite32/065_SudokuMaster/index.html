<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>065_SudokuMaster: 數獨大師 (Zen Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UTT Master-Grade Glassmorphism HUD -->
    <header class="hud-glass">
        <div class="hud-title">數獨大師 <span>ZEN</span></div>
        <div class="hud-stats">
            <div id="stat-time">時間: 00:00</div>
            <div id="stat-focus">心流活化度: <span id="focus-level" style="font-weight:bold;">100%</span></div>
        </div>
        <button id="btn-undo" class="neo-btn">反悔 (Undo)</button>
    </header>

    <!-- Main Game Container -->
    <main id="game-container">
        <!-- Digital Twin Metaphor Dialog -->
        <div id="digital-twin-dialogue" class="hidden">
            <div class="twin-avatar">👩‍🏫 Tessa</div>
            <div class="twin-text" id="twin-msg">慢慢來，邏輯推演就像深呼吸，找到唯一解。</div>
        </div>
        
        <!-- The Grid -->
        <div id="sudoku-grid"></div>
        
        <!-- Number Pad for 50+ Touch (Fat-finger friendly) -->
        <div id="numpad">
            <button class="num-btn" data-val="1">1</button>
            <button class="num-btn" data-val="2">2</button>
            <button class="num-btn" data-val="3">3</button>
            <button class="num-btn" data-val="4">4</button>
            <button class="num-btn" data-val="5">5</button>
            <button class="num-btn" data-val="6">6</button>
            <button class="num-btn" data-val="7">7</button>
            <button class="num-btn" data-val="8">8</button>
            <button class="num-btn" data-val="9">9</button>
            <button class="num-btn action-btn" data-action="clear" style="background: rgba(15, 23, 42, 0.5);">清除</button>
        </div>
    </main>
    
    <!-- Modals -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <h1 id="modal-title">階段完成！</h1>
            <p id="modal-desc" style="font-size:1.2rem; color:#e2e8f0;">邏輯突觸已建立，您的大腦前額葉非常活躍！</p>
            <br>
            <button id="btn-restart" class="neo-btn primary" style="font-size: 1.3rem; padding: 15px 30px;">再次活化大腦</button>
        </div>
    </div>

    <!-- Background Canvas for Particles/Aura -->
    <canvas id="zen-canvas"></canvas>
    
    <script src="game.js"></script>
</body>
</html>
