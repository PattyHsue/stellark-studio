<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>050_MahjongSolitaire: 麻將連連看 (Retro Zen)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Canvas for Zen Ripples -->
    <canvas id="bg-canvas"></canvas>

    <!-- Master-Grade HUD -->
    <header class="hud-glass">
        <div class="hud-title">東方雀跡 <span>RETRO ZEN</span></div>
        <div class="hud-stats">
            <div id="stat-time" class="stat-box">禪意流逝: 00:00</div>
            <div id="stat-focus" class="stat-box">心流: <span id="focus-level" style="font-weight:bold;">100%</span></div>
        <div class="hud-actions" style="display:flex; gap:10px;">
            <button id="btn-guide" class="neo-btn">📖 指南</button>
            <button id="btn-auto" class="neo-btn">🤖 自動</button>
            <button id="btn-shuffle" class="neo-btn">重整</button>
        </div>
    </header>

    <main id="game-container">
        <!-- Digital Twin Dialog -->
        <div id="digital-twin-dialogue" class="hidden">
            <div class="twin-avatar">👩‍🏫 Tessa</div>
            <div class="twin-text" id="twin-msg">慢慢找，用不超過兩個轉角的直線將它們相連。</div>
        </div>
        
        <!-- Game layers -->
        <div id="board-wrapper">
            <canvas id="line-canvas"></canvas>
            <div id="board"></div>
        </div>
    </main>
    
    <!-- Win Modal -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <h1 id="modal-title" style="color:var(--accent-gold);">清空雜念</h1>
            <p id="modal-desc" style="font-size:1.2rem; margin-top:20px;">您的視覺專注力與空間邏輯非常完美！</p>
            <br><br>
            <button id="btn-restart" class="neo-btn" style="font-size: 1.3rem; padding: 15px 30px; border-color:var(--accent-gold); color:var(--accent-gold);">再次修行</button>
        </div>
    </div>
    
    <!-- Quick Guide Modal -->
    <div id="guide-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:200; display:flex; align-items:center; justify-content:center;">
        <div class="modal-box" style="text-align:left; max-width: 500px;">
            <h2 style="color:var(--accent-gold); margin-top:0; border-bottom:1px solid rgba(251, 191, 36, 0.3); padding-bottom:10px;">📖 快速指南 (Quick Guide)</h2>
            <ul style="font-size:1.15rem; line-height:1.8; color:#ecfdf5; padding-left:20px;">
                <li>點擊兩張**相同圖案**的麻將牌。</li>
                <li>連線路徑不能被其他未消除的牌阻擋。</li>
                <li>連線路徑最多只能有<b>兩次轉角</b>。</li>
                <li>若找不到，系統會在 <span style="color:var(--accent-teal);">12 秒後</span>給予發光提示。</li>
                <li>點擊「🤖 自動」可啟動 AI 代打模式！</li>
            </ul>
            <div style="text-align:center; margin-top:25px;">
                <button id="btn-close-guide" class="neo-btn" style="border-color:var(--accent-gold); color:var(--accent-gold); font-size:1.2rem;">我了解了 (Start)</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
