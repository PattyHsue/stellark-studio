<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>028_RHYTHM | UTT-v2.0 MASTER-GRADE ENGINE</title>
    <meta name="description" content="霓虹節奏 旗艦版 - 基於 UTT-v2.0 工業標準、120BPM 精準時鐘與 2026 數位頻譜美學。體驗極致感官同步。">
    <meta name="keywords" content="Rhythm Game, Web Audio, UTT-v2.0, Neon Aesthetics, Performance Optimization">
    <meta name="author" content="UTT-v2.0 Architectural Sovereigns">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="028_RHYTHM | NEON MASTERY">
    <meta property="og:description" content="極致數位同步體驗。">
    <meta property="og:type" content="website">

    <!-- Google Fonts: Outfit (Global Standard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UTT Digital Twin Role-play Prompt (Machine-Readable Context) -->
    <!-- ID: UTT_RHYTHM_TWIN_v1.0 -->
    <!-- CONTEXT: You are the 'Rhythm Sync Consultant'. Your goal is to help the user master the timing of 028_RHYTHM. 
         You explain concepts like BPM synchronization, Web Audio scheduling (lookahead), and Dynamic Difficulty scaling.
         Maintain a high-energy, cyber-mentor persona. 'Synchronization is not just a skill, it is an art.' -->
    
    <div id="app-container">
        <!-- 核心美學: Master-Grade Cyber HUD -->
        <header id="main-hud">
            <div class="hud-section hud-left">
                <h1 id="brand-title">028_RHYTHM <span>MASTER-GRADE</span></h1>
            </div>
            
            <nav class="hud-section hud-center">
                <div class="metric-group" title="當前得分">
                    <span class="metric-label">分數</span>
                    <span id="score-val" class="metric-value">000000</span>
                </div>
                <div class="metric-group" title="當前連擊">
                    <span class="metric-label">連擊</span>
                    <span id="combo-display" class="metric-value">000</span>
                </div>
                <div class="metric-group" title="同步精準度">
                    <span class="metric-label">同步率</span>
                    <span id="lives-display" class="metric-value">100%</span>
                </div>
            </nav>
            
            <div class="hud-section hud-right">
                <button id="auto-pilot-toggle" class="glow-control" aria-label="Toggle Auto Pilot">
                    <span class="icon">🤖</span> 自動 <span id="auto-pilot-status">OFF</span>
                </button>
            </div>
        </header>

        <!-- 遊戲主畫布渲染區域 (Optimized Rendering Area) -->
        <main id="canvas-wrapper">
            <canvas id="stage" aria-label="Rhythm Game Stage"></canvas>
        </main>

        <!-- 狀態覆蓋層 (Non-blocking Cinematic UI) -->
        <div id="game-overlay" class="overlay-modal active">
            <div class="overlay-inner">
                <h2 id="overlay-heading">SYNCHRONIZE</h2>
                <div class="divider"></div>
                <p id="overlay-description">
                    偵測到數位脈衝。跟隨節奏點擊，完美同步 120BPM 核心。<br>
                    使用鍵盤 <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> 或點擊對應音軌。
                </p>
                <button id="init-game-btn" class="primary-action">開始同步</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
