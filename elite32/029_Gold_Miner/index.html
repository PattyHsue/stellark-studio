<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>029_GOLD_MINER | UTT-v2.0 MASTER-GRADE</title>
    <meta name="description" content="GOLD MINER 旗艦級重構版本，基於 UTT-v2.0 工業標準與 2026 黃金礦工視覺美學。">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- 核心美學: Luxe Gold HUD -->
        <header id="main-hud">
            <div class="hud-section hud-left">
                <h1 id="brand-title">029_GOLD <span>MINER</span></h1>
            </div>
            
            <div class="hud-section hud-center">
                <div class="metric-group">
                    <span class="metric-label">當前收益</span>
                    <span id="score-val" class="metric-value">$000000</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">剩餘時間</span>
                    <span id="timer-val" class="metric-value">00:60</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">目標金額</span>
                    <span id="target-val" class="metric-value">$001200</span>
                </div>
            </div>
            
            <div class="hud-section hud-right">
                <button id="auto-pilot-toggle" class="glow-control">
                    <span class="icon">🤖</span> 自動 <span id="auto-pilot-status">OFF</span>
                </button>
            </div>
        </header>

        <!-- 遊戲主畫布渲染容器 -->
        <div id="canvas-wrapper">
            <canvas id="stage"></canvas>
        </div>

        <!-- 狀態覆蓋層 (非阻塞 UI) -->
        <div id="game-overlay" class="overlay-modal active">
            <div class="overlay-inner">
                <h2 id="overlay-heading">LUXE MINER 2026</h2>
                <div class="divider"></div>
                <p id="overlay-description">深挖地底財富，在限制時間內達成黃金業績目標。</p>
                <button id="init-game-btn" class="primary-action">開始挖掘</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
